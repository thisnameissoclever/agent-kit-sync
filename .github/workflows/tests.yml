name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          # Python 3.9 is the oldest version agent-kit-sync supports. The Ubuntu
          # image behind ubuntu-latest has no 3.9, so Linux tests it on 24.04.
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure Git for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Run tests
        working-directory: tests
        run: python -m unittest -v
